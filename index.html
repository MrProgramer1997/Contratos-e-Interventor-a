<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingreso – Contratos & Interventoría</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="nav">
      <div class="brand">Club Campestre Pereira <span class="badge">Acceso</span></div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width:520px;margin:0 auto;">
      <h2 style="margin-top:0;">Ingreso</h2>
      <p class="small">Inicia sesión o crea tu usuario. (Luego el Admin asigna el rol).</p>

      <!-- IMPORTANTE: NO usamos submit -->
      <div class="grid grid-1">
        <div>
          <label>Correo</label>
          <input class="input" id="email" type="email" placeholder="correo@campestrepereira.com" />
        </div>

        <div>
          <label>Contraseña</label>
          <input class="input" id="password" type="password" placeholder="••••••••" />
        </div>
      </div>

      <div class="hr"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn secondary" id="btnRegistro" type="button">Crear usuario</button>
        <button class="btn" id="btnLogin" type="button">Ingresar</button>
      </div>

      <div class="hr"></div>
      <div class="small" id="msg"></div>
    </div>
  </div>

  <!-- Supabase UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">
    import "./js/supabaseClient.js";
    import { signUp, signIn } from "./js/auth.js";
    import { toast, setLoading } from "./js/ui.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const msg = document.getElementById("msg");

    const btnRegistro = document.getElementById("btnRegistro");
    const btnLogin = document.getElementById("btnLogin");

    function show(text) {
      msg.textContent = text || "";
    }

    btnRegistro.addEventListener("click", async () => {
      try {
        setLoading(btnRegistro, true, "Creando...");
        show("");

        const e = email.value.trim();
        const p = password.value.trim();
        if (!e || !p) return toast("Completa correo y contraseña.", "error");

        await signUp(e, p);

        toast("Usuario creado. Ahora puedes ingresar.", "success");
        show("Usuario creado. Ahora inicia sesión.");
      } catch (err) {
        toast(err.message || "No se pudo registrar.", "error");
        show(err.message || "No se pudo registrar.");
      } finally {
        setLoading(btnRegistro, false);
      }
    });

    btnLogin.addEventListener("click", async () => {
      try {
        setLoading(btnLogin, true, "Ingresando...");
        show("");

        const e = email.value.trim();
        const p = password.value.trim();
        if (!e || !p) return toast("Completa correo y contraseña.", "error");

        await signIn(e, p);

        toast("Bienvenido.", "success");
        window.location.href = "./dashboard.html";
      } catch (err) {
        toast(err.message || "No se pudo ingresar.", "error");
        show(err.message || "No se pudo ingresar.");
      } finally {
        setLoading(btnLogin, false);
      }
    });
  </script>
</body>
</html>
