<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Interventorías – Club Campestre Pereira</title>
  <link rel="stylesheet" href="./assets/css/styles.css"/>
</head>
<body>
  <div class="topbar">
    <div class="nav">
      <div class="brand">Club Campestre Pereira <span class="badge">Interventorías</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <a class="btn secondary" href="./dashboard.html">Dashboard</a>
        <a class="btn secondary" href="./contratos.html">Contratos</a>
        <a class="btn secondary" href="./reportes.html">Reportes</a>
        <a class="btn secondary" href="./admin.html" id="adminLink" style="display:none;">Admin</a>
        <button class="btn danger" id="btnSalir">Salir</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div>
          <h2 style="margin:0;">Planillas de interventoría</h2>
          <div class="small" id="whoami"></div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div style="min-width:240px;">
            <label>Buscar</label>
            <input class="input" id="q" placeholder="Código, contratista, interventor, tipo contrato..."/>
          </div>
          <div style="min-width:220px;">
            <label>Estado</label>
            <select class="input" id="fEstado">
              <option value="">Todos</option>
              <option>BORRADOR</option>
              <option>FINALIZADA</option>
            </select>
          </div>
          <button class="btn" id="btnNuevo">+ Nueva interventoría</button>
        </div>
      </div>

      <div class="hr"></div>

      <div id="panelNuevo" class="card" style="display:none;">
        <h3 style="margin-top:0;">Nueva planilla (según PDF)</h3>

        <div class="grid grid-2">
          <div>
            <label>Contrato relacionado (opcional)</label>
            <input class="input" id="contrato_id" placeholder="Pega el ID del contrato si aplica (opcional)"/>
            <div class="small">Normalmente se crea desde el detalle del contrato cuando es obligatoria.</div>
          </div>
          <div>
            <label>Fecha del informe</label>
            <input class="input" type="date" id="fecha_informe"/>
          </div>
        </div>

        <div class="grid grid-2" style="margin-top:10px;">
          <div>
            <label>Nombre del contratista</label>
            <input class="input" id="nombre_contratista"/>
          </div>
          <div>
            <label>Tipo de contrato</label>
            <input class="input" id="tipo_contrato"/>
          </div>
        </div>

        <div class="grid grid-2" style="margin-top:10px;">
          <div>
            <label>Nombre del interventor</label>
            <input class="input" id="nombre_interventor"/>
          </div>
          <div>
            <label>Cargo</label>
            <input class="input" id="cargo_interventor"/>
          </div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px;">
          <button class="btn secondary" id="btnCancelarNuevo">Cancelar</button>
          <button class="btn" id="btnGuardarNuevo">Crear (BORRADOR)</button>
        </div>
      </div>

      <div class="hr"></div>

      <div style="overflow:auto;">
        <table class="table" id="tbl">
          <thead>
            <tr>
              <th>Código</th>
              <th>Fecha</th>
              <th>Contratista</th>
              <th>Interventor</th>
              <th>Tipo</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import "./js/supabaseClient.js";
    import { requireAuth, signOut, getMyProfile } from "./js/auth.js";
    import { initInterventoriasPage } from "./js/interventorias.js";

    await requireAuth();
    const profile = await getMyProfile();

    if (profile.rol === "admin") document.getElementById("adminLink").style.display = "inline-block";
    document.getElementById("whoami").textContent = `${profile.email} • ${profile.rol.toUpperCase()}${profile.area ? " • " + profile.area : ""}`;
    document.getElementById("btnSalir").addEventListener("click", signOut);

    await initInterventoriasPage(profile);
  </script>
</body>
</html>
